[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos-memory"
version = "0.7.0b1"
description = "Scoped local memory for coding agents, with SQLite persistence, MCP tools, and experimental memory enrichment."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anthony Maio", email = "anthony.maio@gmail.com" }
]
keywords = [
    "llm", "memory", "biomimetic", "rag", "neuroscience",
    "ai", "spreading-activation", "predictive-coding"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "platformdirs>=4.0.0",
    "sqlite-vec>=0.1.6,<0.2.0",
    "fastembed>=0.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomlkit>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ollama = [
    "ollama>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
all = [
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "mcp>=1.0.0,<2.0.0",
]
dev = [
    "packaging>=23.0.0",
    "jsonschema>=4.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
mnemos = "mnemos.cli:main"
mnemos-mcp = "mnemos.mcp_server:main"
mnemos-cli = "mnemos.cli:main"
mnemos-benchmark = "mnemos.benchmark:main"

[project.entry-points."hermes_agent.memory_providers"]
mnemos = "mnemos.adapters.hermes:register"

[project.urls]
Homepage = "https://mnemos.making-minds.ai"
Repository = "https://github.com/anthony-maio/mnemos"
Documentation = "https://github.com/anthony-maio/mnemos#readme"
"Bug Tracker" = "https://github.com/anthony-maio/mnemos/issues"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]

[tool.hatch.build.targets.sdist]
include = [
    "/mnemos",
    "/agents",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/examples/restart_recall.py",
    "/scripts/smoke-installed.py",
    "/benchmarks/datasets/*.jsonl",
]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "mnemos/resources/agents"
"benchmarks/datasets" = "mnemos/resources/benchmark-datasets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
incremental = false
# Validation archives contain immutable copies of executed helpers, not modules.
exclude = "(^tests/|^examples/|^docs/validation/)"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
# Preserve the exact bytes and hashes of archived execution evidence.
extend-exclude = "(^|/)docs/validation/"
