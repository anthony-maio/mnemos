name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, fix/mnemos-delivery-20261026]
  pull_request:
    branches: [master]

env:
  MNEMOS_AUTO_START: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: black --check .
      - run: mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  benchmark_gate:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m mnemos.benchmark --stores memory,sqlite --retrievers baseline,engine --dataset-pack claim-driving --top-k 1 --repetitions 2 --enforce-production-gate

  tier1_mcp_smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_mcp_compatibility.py

  tier2_mcp_smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_mcp_tier2_smoke.py

  release_readiness:
    runs-on: ubuntu-latest
    needs: [benchmark_gate, tier1_mcp_smoke, installed_artifact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_docs_consistency.py tests/test_mcp_compatibility.py
      - run: test -f docs/release-checklist.md

  installed_artifact:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke-installed.py --wheel dist/*.whl --output installed-artifact.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-artifact-verification
          path: installed-artifact.json
